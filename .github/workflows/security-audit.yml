name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/security-audit.yml'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Dependency audit & SBOM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          clean: true

      # No apt build deps needed: cargo-deny/cargo-cyclonedx are prebuilt
      # binaries and only read Cargo.lock / cargo metadata — nothing compiles.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Key is scoped with '-audit-' so this job stops sharing (and thrashing)
      # a cache key with nightly-stress, which stores different content under
      # the same lockfile hash.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-

      # Prebuilt binaries (seconds) instead of `cargo install` (minutes of
      # compilation on every run).
      - name: Install cargo-deny and cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-cyclonedx

      - name: cargo deny check
        run: cargo deny check
        # License AND RustSec advisory compliance — deny.toml has an
        # [advisories] section, so the old separate rustsec/audit-check step
        # was a second compile of the same scan and has been removed.
        # Requirements: 4.1, 4.2, 4.3

      # SBOMs are only consumed for releases — generating one per PR is noise.
      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        run: |
          for manifest in $(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; [print(p['manifest_path']) for p in json.load(sys.stdin)['packages'] if p['name'] != 'wavis-gui']"); do
            cargo cyclonedx --manifest-path "$manifest"
          done
        # Produces CycloneDX SBOM for all workspace crates.
        # Requirements: 4.4

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ./**/bom.xml
          if-no-files-found: warn
