name: Workspace CI

on:
  push:
    branches: [main, pre-dev]
    paths:
      - 'wavis-backend/**'
      - 'shared/**'
      - 'clients/**'
      - '.github/workflows/workspace-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'wavis-backend/**'
      - 'shared/**'
      - 'clients/**'
      - '.github/workflows/workspace-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read
  pull-requests: read

# Cancel previous runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Disable debug info on CI — the symbol tables are what bloat linker memory,
  # not the code.  A single link of aws-sdk-ec2 + full backend with full debug
  # info exceeds the 7 GB GitHub Actions runner limit.  0 = no debug info.
  # (CARGO_BUILD_JOBS=1 used to be a secondary OOM guard, but it serializes
  # ALL compilation — not just linking — and multiplied CI time. debug=0 is
  # what actually fixed the OOM.)
  CARGO_PROFILE_DEV_DEBUG: 0
  # Retry transient crates.io network failures (SSL EOF, timeout, etc).
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 120
  # All workspace packages EXCEPT wavis-gui (Tauri crate needs GTK/WebKit
  # system libs that aren't available on the CI runner).
  CI_PACKAGES: >-
    -p shared
    -p wavis-backend
    -p wavis-client-shared
    -p wavis-cli-test
    -p wavis-client
    -p ws-sfu-test
    -p stress-harness
    -p gui-surface-test

jobs:
  # ── Detect which areas changed ──────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
      clients: ${{ steps.filter.outputs.clients }}
      gui: ${{ steps.filter.outputs.gui }}
      tauri: ${{ steps.filter.outputs.tauri }}
      cargo-root: ${{ steps.filter.outputs.cargo-root }}
      backend-other: ${{ steps.filter.outputs.backend-other }}
      # Granular Backend Filters
      auth: ${{ steps.filter.outputs.auth }}
      voice: ${{ steps.filter.outputs.voice }}
      channel: ${{ steps.filter.outputs.channel }}
      abuse: ${{ steps.filter.outputs.abuse }}
      ws: ${{ steps.filter.outputs.ws }}
      security: ${{ steps.filter.outputs.security }}
      screen: ${{ steps.filter.outputs.screen }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      # Keep change detection independent of GitHub's PR-files API. Integration
      # PRs have repeatedly received GitHub's HTML "Unicorn" error page from
      # that endpoint, which otherwise fails this job before any tests can run.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # An empty token makes paths-filter use the checked-out git history
          # for pull requests instead of calling the PR-files REST endpoint.
          token: ''
          filters: |
            backend:
              - 'wavis-backend/**'
            shared:
              - 'shared/**'
            clients:
              - 'clients/**'
              - '!clients/wavis-gui/**'
            gui:
              - 'clients/wavis-gui/**'
            tauri:
              - 'clients/wavis-gui/src-tauri/**'
            cargo-root:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/workspace-ci.yml'
            # Granular Backend Logic
            auth:
              - 'wavis-backend/src/auth/**'
              - 'wavis-backend/tests/auth_integration.rs'
              - 'wavis-backend/tests/ws_auth_integration.rs'
              - 'wavis-backend/tests/jwt_validation.rs'
              - 'wavis-backend/tests/device_integration.rs'
              - 'wavis-backend/tests/pairing_integration.rs'
              - 'wavis-backend/tests/recovery_integration.rs'
            voice:
              - 'wavis-backend/src/voice/**'
              - 'wavis-backend/tests/voice_orchestration_integration.rs'
              - 'wavis-backend/tests/voice_ws_integration.rs'
              - 'wavis-backend/tests/sfu_relay_integration.rs'
              - 'wavis-backend/tests/p2p_relay_integration.rs'
              - 'wavis-backend/tests/turn_credentials_integration.rs'
              - 'wavis-backend/tests/livekit_e2e_integration.rs'
            channel:
              - 'wavis-backend/src/channel/**'
              - 'wavis-backend/tests/channel_integration.rs'
              - 'wavis-backend/tests/channel_rest_integration.rs'
              - 'wavis-backend/tests/invite_lifecycle_integration.rs'
              - 'wavis-backend/tests/create_room_integration.rs'
              - 'wavis-backend/tests/display_name_integration.rs'
            abuse:
              - 'wavis-backend/src/abuse/**'
              - 'wavis-backend/tests/abuse_controls_integration.rs'
            ws:
              - 'wavis-backend/src/ws/**'
              - 'wavis-backend/tests/signaling_relay_integration.rs'
            security:
              - 'wavis-backend/src/redaction.rs'
              - 'wavis-backend/tests/security_hardening_integration.rs'
              - 'wavis-backend/tests/no_sensitive_logs.rs'
              - 'wavis-backend/tests/authorization_matrix_integration.rs'
            screen:
              - 'wavis-backend/tests/screen_share_integration.rs'
              - 'wavis-backend/tests/screen_share_ws_integration.rs'
            core:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - 'wavis-backend/src/lib.rs'
              - 'wavis-backend/src/main.rs'
              - 'wavis-backend/src/app_state.rs'
              - 'wavis-backend/src/state.rs'
            # Backend paths NOT covered by any granular bucket above (chat,
            # diagnostics, connections, ip, redaction, uncategorized tests…).
            # When this matches, the full backend test suite runs — a hole in
            # the granular filters must fail safe, not skip tests.
            backend-other:
              - 'wavis-backend/**'
              - '!wavis-backend/src/auth/**'
              - '!wavis-backend/src/voice/**'
              - '!wavis-backend/src/channel/**'
              - '!wavis-backend/src/abuse/**'
              - '!wavis-backend/src/ws/**'
              - '!wavis-backend/src/redaction.rs'
              - '!wavis-backend/src/lib.rs'
              - '!wavis-backend/src/main.rs'
              - '!wavis-backend/src/app_state.rs'
              - '!wavis-backend/src/state.rs'
              - '!wavis-backend/tests/auth_integration.rs'
              - '!wavis-backend/tests/ws_auth_integration.rs'
              - '!wavis-backend/tests/jwt_validation.rs'
              - '!wavis-backend/tests/device_integration.rs'
              - '!wavis-backend/tests/pairing_integration.rs'
              - '!wavis-backend/tests/recovery_integration.rs'
              - '!wavis-backend/tests/voice_orchestration_integration.rs'
              - '!wavis-backend/tests/voice_ws_integration.rs'
              - '!wavis-backend/tests/sfu_relay_integration.rs'
              - '!wavis-backend/tests/p2p_relay_integration.rs'
              - '!wavis-backend/tests/turn_credentials_integration.rs'
              - '!wavis-backend/tests/livekit_e2e_integration.rs'
              - '!wavis-backend/tests/channel_integration.rs'
              - '!wavis-backend/tests/channel_rest_integration.rs'
              - '!wavis-backend/tests/invite_lifecycle_integration.rs'
              - '!wavis-backend/tests/create_room_integration.rs'
              - '!wavis-backend/tests/display_name_integration.rs'
              - '!wavis-backend/tests/abuse_controls_integration.rs'
              - '!wavis-backend/tests/signaling_relay_integration.rs'
              - '!wavis-backend/tests/security_hardening_integration.rs'
              - '!wavis-backend/tests/no_sensitive_logs.rs'
              - '!wavis-backend/tests/authorization_matrix_integration.rs'
              - '!wavis-backend/tests/screen_share_integration.rs'
              - '!wavis-backend/tests/screen_share_ws_integration.rs'


  # Secret scanning lives in secret-scan.yml (gitleaks-action, all PRs) —
  # the duplicate gitleaks CLI job that used to live here was removed.

  # ── Rust build + test (backend, shared crate, client crates) ────────
  rust-test:
    name: Rust tests (workspace)
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.clients == 'true' ||
      needs.changes.outputs.cargo-root == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Remove Tauri GUI crate from workspace
        run: sed -i '/"clients\/wavis-gui\/src-tauri"/d' Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev libasound2-dev libva-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt

      # Cheap gates first: formatting and architecture boundaries fail in
      # seconds, before any compilation.
      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Architecture boundary check
        run: node scripts/arch-check.mjs

      # Caches ~/.cargo/registry, ~/.cargo/git, and target/ — shared key
      # means test-db job can restore from this job's saved cache.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
          # pre-dev is the integration branch — saving there keeps PR caches
          # fresh instead of pinning them to release-time main.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pre-dev' }}

      # Clippy first — its artifacts are reused by cargo test below,
      # minimising recompilation within the job.
      - name: Clippy (default features)
        run: cargo clippy $CI_PACKAGES -- -D warnings

      - name: Clippy (livekit feature)
        run: cargo clippy -p wavis-client-shared --features livekit,real-backends -p wavis-client --features livekit -p wavis-cli-test --features livekit -- -D warnings

      # Non-blocking complexity + audit metrics. Review triggers only — never
      # a gate. See CLAUDE.md "Code Standards & Gates" and code_standards.md
      # "Workspace lint inheritance": these lints stay CLI-only (not in
      # [workspace.lints]) until their violation count is verified zero,
      # because a manifest "warn" gets promoted to a hard error by the
      # blocking step's `-D warnings` the moment it's added.
      - name: Clippy metrics (non-blocking)
        continue-on-error: true
        run: >-
          cargo clippy $CI_PACKAGES --
          -W clippy::cognitive_complexity -W clippy::too_many_lines
          -W clippy::undocumented_unsafe_blocks
          -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic
          -W clippy::await_holding_lock -W clippy::large_futures -W clippy::large_stack_arrays
          -W clippy::redundant_clone -W clippy::needless_pass_by_value -W clippy::mutex_atomic

      # cargo test builds implicitly — no separate cargo build step needed.
      - name: Full workspace tests
        if: github.ref == 'refs/heads/main' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: cargo test $CI_PACKAGES

      # Backend changed in a path no granular bucket covers (chat, diagnostics,
      # connections, …) — run the whole backend suite rather than nothing.
      - name: "Targeted Backend: Fallback (uncategorized paths)"
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.backend-other == 'true'
        run: cargo test -p wavis-backend

      # Targeted runs only exercise --test binaries; unit tests in src/ must
      # still run whenever any backend code changed.
      - name: "Targeted Backend: Unit tests"
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend-other != 'true'
        run: cargo test -p wavis-backend --lib --bins

      - name: "Targeted Backend: Auth"
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.auth == 'true'
        run: cargo test -p wavis-backend --test auth_integration --test ws_auth_integration --test jwt_validation --test device_integration --test pairing_integration --test recovery_integration

      - name: "Targeted Backend: Voice"
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.voice == 'true'
        run: cargo test -p wavis-backend --test voice_orchestration_integration --test voice_ws_integration --test sfu_relay_integration --test p2p_relay_integration --test turn_credentials_integration --test livekit_e2e_integration

      - name: "Targeted Backend: Channel"
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.channel == 'true'
        run: cargo test -p wavis-backend --test channel_integration --test channel_rest_integration --test invite_lifecycle_integration --test create_room_integration --test display_name_integration

      - name: "Targeted Backend: WS & Signaling"
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.ws == 'true'
        run: cargo test -p wavis-backend --test signaling_relay_integration --test ws_auth_integration

      - name: "Targeted Backend: Security & Abuse"
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && (needs.changes.outputs.security == 'true' || needs.changes.outputs.abuse == 'true')
        run: cargo test -p wavis-backend --test security_hardening_integration --test no_sensitive_logs --test authorization_matrix_integration --test abuse_controls_integration

      - name: "Targeted Backend: Screen Share"
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.screen == 'true'
        run: cargo test -p wavis-backend --test screen_share_integration --test screen_share_ws_integration

      - name: Client tests
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.clients == 'true'
        run: |
          cargo test -p wavis-client-shared
          cargo test -p wavis-client
          cargo test -p wavis-cli-test

      - name: Unit and integration tests (livekit feature)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.clients == 'true' || needs.changes.outputs.voice == 'true'
        run: cargo test -p wavis-client-shared --features livekit,real-backends


  # ── GUI unit tests (vitest) ─────────────────────────────────────────
  gui-test:
    name: GUI tests (vitest + tsc)
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.gui == 'true' ||
      needs.changes.outputs.cargo-root == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('clients/wavis-gui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      # npm install (not ci): package-lock.json is gitignored in this repo,
      # so there is no lockfile for npm ci to install from. If the lockfile
      # is ever committed, switch this to npm ci for reproducible installs.
      - name: Install GUI dependencies
        run: npm install --no-audit --no-fund
        working-directory: clients/wavis-gui

      - name: GUI Prettier check
        run: npm run format:check
        working-directory: clients/wavis-gui

      - name: GUI ESLint
        run: npm run lint
        working-directory: clients/wavis-gui

      - name: GUI dependency-cruiser
        run: npm run lint:deps
        working-directory: clients/wavis-gui

      - name: GUI release config check
        run: npm run check:release-config
        working-directory: clients/wavis-gui

      - name: GUI LiveKit patch verification
        run: npm run verify:livekit-patch
        working-directory: clients/wavis-gui

      - name: GUI mic bitrate lint
        run: npm run lint:mic-bitrate
        working-directory: clients/wavis-gui

      - name: GUI forbidden macOS path lint
        run: npm run lint:forbidden-macos-paths
        working-directory: clients/wavis-gui

      - name: GUI Linux matrix codegen check
        run: npm run check:linux-matrix
        working-directory: clients/wavis-gui

      - name: GUI TypeScript type check
        run: npx tsc --noEmit
        working-directory: clients/wavis-gui

      - name: GUI unit tests
        run: npm test
        working-directory: clients/wavis-gui


  # ── DB-dependent integration tests (Postgres) ──────────────────────
  test-db:
    name: DB tests (Postgres)
    runs-on: ubuntu-latest
    needs: [changes, rust-test]
    if: >-
      always() &&
      (needs.rust-test.result == 'success' || needs.rust-test.result == 'skipped') &&
      (
        github.ref == 'refs/heads/main' ||
        needs.changes.outputs.core == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.backend-other == 'true' ||
        needs.changes.outputs.auth == 'true' ||
        needs.changes.outputs.channel == 'true' ||
        needs.changes.outputs.voice == 'true'
      )

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wavis
          POSTGRES_PASSWORD: wavis
          POSTGRES_DB: wavis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wavis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://wavis:wavis@localhost:5432/wavis
      AUTH_JWT_SECRET: ci-auth-secret-at-least-32-bytes!!

    steps:
      - uses: actions/checkout@v5

      - name: Remove Tauri GUI crate from workspace
        run: sed -i '/"clients\/wavis-gui\/src-tauri"/d' Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev libasound2-dev libva-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.93.1

      # Restores the cache saved by rust-test (same shared-key).
      # save-if: false — rust-test owns the save, this job only reads.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
          save-if: 'false'

      # All Postgres-gated suites self-run migrations and isolate via table
      # truncation / #[serial], so --test-threads=1 keeps them safe.
      # --features test-support is required by channel_rest/voice_ws and
      # harmless for the rest (keeps a single compile configuration).
      - name: "DB tests: full suite"
        if: >-
          github.ref == 'refs/heads/main' ||
          needs.changes.outputs.core == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.backend-other == 'true'
        run: cargo test -p wavis-backend --features test-support --test auth_integration --test device_integration --test pairing_integration --test recovery_integration --test cleanup_integration --test channel_integration --test channel_rest_integration --test voice_orchestration_integration --test voice_ws_integration -- --ignored --test-threads=1

      - name: "DB tests: auth"
        if: >-
          github.ref != 'refs/heads/main' &&
          needs.changes.outputs.core != 'true' &&
          needs.changes.outputs.shared != 'true' &&
          needs.changes.outputs.backend-other != 'true' &&
          needs.changes.outputs.auth == 'true'
        run: cargo test -p wavis-backend --features test-support --test auth_integration --test device_integration --test pairing_integration --test recovery_integration --test cleanup_integration -- --ignored --test-threads=1

      - name: "DB tests: channel"
        if: >-
          github.ref != 'refs/heads/main' &&
          needs.changes.outputs.core != 'true' &&
          needs.changes.outputs.shared != 'true' &&
          needs.changes.outputs.backend-other != 'true' &&
          needs.changes.outputs.channel == 'true'
        run: cargo test -p wavis-backend --features test-support --test channel_integration --test channel_rest_integration -- --ignored --test-threads=1

      - name: "DB tests: voice"
        if: >-
          github.ref != 'refs/heads/main' &&
          needs.changes.outputs.core != 'true' &&
          needs.changes.outputs.shared != 'true' &&
          needs.changes.outputs.backend-other != 'true' &&
          needs.changes.outputs.voice == 'true'
        run: cargo test -p wavis-backend --features test-support --test voice_orchestration_integration --test voice_ws_integration -- --ignored --test-threads=1


  # ── Tauri Rust crate compile check (Windows) ────────────────────────
  # src-tauri is sed-removed from every Linux job (needs GTK/WebKit there),
  # so without this job a Rust compile error in the Tauri crate passes all
  # PR CI and only surfaces in the Codemagic release build. Windows needs
  # no system libs for Tauri — a plain cargo check catches it in minutes.
  tauri-check:
    name: Tauri crate check (Windows)
    runs-on: windows-latest
    needs: [changes]
    if: needs.changes.outputs.tauri == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tauri-${{ runner.os }}
          workspaces: '. -> target'

      # tauri-build validates that frontendDist (../dist) exists at compile
      # time. An empty directory is enough for cargo check — we are not
      # bundling the frontend here.
      - name: Create placeholder frontend dist
        run: New-Item -ItemType Directory -Force clients/wavis-gui/dist | Out-Null

      - name: Cargo check Tauri crate
        run: cargo check -p wavis-gui --message-format=short
