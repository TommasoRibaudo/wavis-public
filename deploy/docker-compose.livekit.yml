services:
  redis:
    container_name: wavis-livekit-redis
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  livekit:
    container_name: wavis-livekit
    image: livekit/livekit-server:v1.9.3
    # The prod host pre-renders this file once via SSM to avoid runtime
    # template substitution inside the container.
    entrypoint:
      - /livekit-server
    command:
      - --config
      - /etc/livekit.yaml
    depends_on:
      - redis
    ports:
      - "7880:7880"
      - "7881:7881"
      - "51000-51100:51000-51100/udp"
    volumes:
      - /etc/wavis/livekit.rendered.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
